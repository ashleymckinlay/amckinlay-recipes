Description: Downloads the latest arm64 (Apple silicon) version of the GitHub Copilot app and creates a Package.
Identifier: com.github.ashleymckinlay.pkg.GitHub_Copilot
ParentRecipe: com.github.ashleymckinlay.download.GitHub_Copilot
MinimumVersion: '2.3'

Input:
  NAME: GitHub Copilot
  SOFTWARE_TITLE: GitHub_Copilot

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: '%pathname%/GitHub Copilot.app'
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'
