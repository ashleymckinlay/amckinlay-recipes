Description: Downloads the latest arm64 (Apple silicon) version of the GitHub Copilot app (https://github.com/features/ai/github-app).
Identifier: com.github.ashleymckinlay.download.GitHub_Copilot
MinimumVersion: '2.3'

Input:
  NAME: GitHub Copilot
  SOFTWARE_TITLE: GitHub_Copilot
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: github/app
      asset_regex: GitHub-Copilot-darwin-arm64\.dmg

  - Processor: URLDownloader
    Arguments:
      filename: '%SOFTWARE_TITLE%-arm64.dmg'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      strict_verification: true
      input_path: '%pathname%/GitHub Copilot.app'
      requirement: identifier "com.github.githubapp" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = VEKTX9H2N7

  - Processor: Versioner
    Arguments:
      input_plist_path: '%pathname%/GitHub Copilot.app/Contents/Info.plist'
      plist_version_key: CFBundleShortVersionString
