Description: Downloads the latest universal installer pkg of GitHub CLI (gh) and copies it with a versioned name. GitHub's pkg installs gh to /usr/local/bin.
Identifier: com.github.ashleymckinlay.pkg.GitHub_CLI
ParentRecipe: com.github.ashleymckinlay.download.GitHub_CLI
MinimumVersion: '2.3'

Input:
  NAME: GitHub CLI
  SOFTWARE_TITLE: GitHub_CLI

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: '%pathname%'
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'

  - Processor: com.github.smithjw.processors/FriendlyPathDeleter
    Arguments:
      fail_deleter_silently: true
      path_list:
        - '%RECIPE_CACHE_DIR%/unpack'
        - '%RECIPE_CACHE_DIR%/payload'
