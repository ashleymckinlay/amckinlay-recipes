Description: |
  Downloads GIMP and produces a verified artefact for downstream packaging.

  Run as part of the full download → pkg → upload chain. The `URLDownloaderPython`
  processor caches by ETag/Last-Modified/Content-Length and the
  `StopProcessingIf download_changed == False` predicate short-circuits the chain
  on no-op re-runs. Pointing the upload recipe at a pre-built pkg would defeat
  this cache and re-upload on every CI run.
  GIMP publishes separate arm64 (`aarch64`) and Intel (`x86_64`) `.dmg` files. We pull both so the resulting pkg can install on either architecture (see GIMP.pkg.recipe.yaml).
Identifier: com.github.ashleymckinlay.download.GIMP
MinimumVersion: '2.9'

Input:
  NAME: GIMP
  SOFTWARE_TITLE: GIMP

Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: '(//download\.gimp\.org/gimp/v[0-9\.]*?/macos/gimp-[0-9\.\-]*-x86_64(-1)?\.dmg)'
      result_output_var_name: version
      url: 'https://www.gimp.org/downloads/'

  - Processor: URLDownloader
    Arguments:
      url: 'https:%version%'
      filename: '%NAME%-x86_64.dmg'

  - Processor: URLTextSearcher
    Arguments:
      re_pattern: '(//download\.gimp\.org/gimp/v[0-9\.]*?/macos/gimp-[0-9\.\-]*-arm64(-1)?\.dmg)'
      result_output_var_name: version
      url: 'https://www.gimp.org/downloads/'

  - Processor: URLDownloader
    Arguments:
      url: 'https:%version%'
      filename: '%NAME%-arm64.dmg'

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: '%RECIPE_CACHE_DIR%/downloads/%SOFTWARE_TITLE%-arm64.dmg/%SOFTWARE_TITLE%.app'
      requirement: 'identifier "org.gimp.gimp" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = T25BQ8HSJF'
      strict_verification: true

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: '%RECIPE_CACHE_DIR%/downloads/%SOFTWARE_TITLE%-x86_64.dmg/%SOFTWARE_TITLE%.app'
      requirement: 'identifier "org.gimp.gimp" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = T25BQ8HSJF'
      strict_verification: true

  - Processor: Versioner
    Arguments:
      input_plist_path: '%RECIPE_CACHE_DIR%/downloads/%SOFTWARE_TITLE%-arm64.dmg/%SOFTWARE_TITLE%.app/Contents/Info.plist'
      plist_version_key: CFBundleShortVersionString
