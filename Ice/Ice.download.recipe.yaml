Comment: Created with Recipe Robot v2.3.2 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of Ice.
Identifier: com.github.ashleymckinlay.download.Ice
MinimumVersion: '2.3'

Input:
  NAME: Ice

Process:
  - Processor: SparkleUpdateInfoProvider
    Arguments:
      appcast_url: https://jordanbaird.github.io/ice-releases/appcast.xml

  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%-%version%.zip'

  - Processor: EndOfCheckPhase

  - Processor: Unarchiver
    Arguments:
      archive_path: '%pathname%'
      destination_path: '%RECIPE_CACHE_DIR%/%NAME%'
      purge_destination: true

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%RECIPE_CACHE_DIR%/%NAME%/Ice.app'
      requirement: 'anchor apple generic and identifier "com.jordanbaird.Ice" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = K2ATHQPJDP)'
