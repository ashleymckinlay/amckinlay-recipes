Comment: Created with Recipe Robot v2.3.2 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of Ice and creates a package.
Identifier: com.github.ashleymckinlay.pkg.Ice
MinimumVersion: '2.3'
ParentRecipe: com.github.ashleymckinlay.download.Ice

Input:
  NAME: Ice

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: '%RECIPE_CACHE_DIR%/%NAME%/Ice.app'

  - Processor: com.github.smithjw.processors/FriendlyPathDeleter
    Arguments:
      fail_deleter_silently: true
      path_list:
        - '%RECIPE_CACHE_DIR%/extractedfile'
