Description: |
  Downloads MongoDB and produces a verified artefact for downstream packaging.

  Run as part of the full download → pkg → upload chain. The `URLDownloaderPython`
  processor caches by ETag/Last-Modified/Content-Length and the
  `StopProcessingIf download_changed == False` predicate short-circuits the chain
  on no-op re-runs. Pointing the upload recipe at a pre-built pkg would defeat
  this cache and re-upload on every CI run.
  MongoDB publishes separate arm64 (`aarch64`) and Intel (`x86_64`) `.dmg` files. We pull both so the resulting pkg can install on either architecture (see MongoDB.pkg.recipe.yaml).
Identifier: com.github.ashleymckinlay.download.MongoDBCompass
MinimumVersion: '2.9'

Input:
  NAME: MongoDB
  SOFTWARE_TITLE: MongoDB Compass

Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: 'mongodb-compass-([A-Za-z0-9]+(\.[A-Za-z0-9]+)+)-darwin'
      result_output_var_name: DOWNLOAD_VERSION
      url: 'https://www.mongodb.com/try/download/compass'

  - Processor: URLDownloaderPython
    Arguments:
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'
      filename: '%NAME%-x86_64.dmg'
      url: 'https://downloads.mongodb.com/compass/mongodb-compass-%DOWNLOAD_VERSION%-darwin-x64.dmg'

  - Processor: URLDownloaderPython
    Arguments:
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'
      filename: '%NAME%-arm64.dmg'
      url: 'https://downloads.mongodb.com/compass/mongodb-compass-%DOWNLOAD_VERSION%-darwin-arm64.dmg'

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: '%RECIPE_CACHE_DIR%/downloads/%NAME%-arm64.dmg/%SOFTWARE_TITLE%.app'
      requirement: 'identifier "org.MongoDB.MongoDB" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = T25BQ8HSJF'
      strict_verification: true

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: '%RECIPE_CACHE_DIR%/downloads/%NAME%-x86_64.dmg/%SOFTWARE_TITLE%.app'
      requirement: 'identifier "org.MongoDB.MongoDB" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = T25BQ8HSJF'
      strict_verification: true

  - Processor: Versioner
    Arguments:
      input_plist_path: '%RECIPE_CACHE_DIR%/downloads/%NAME%-arm64.dmg/%SOFTWARE_TITLE%.app/Contents/Info.plist'
      plist_version_key: CFBundleShortVersionString
