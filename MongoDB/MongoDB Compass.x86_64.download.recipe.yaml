Description: |
  Downloads the latest version of MongoDB Compass.

  To download the Intel version use "x64" in DOWNLOAD_TYPE
  To download the Apple Silicon version use "arm64" in DOWNLOAD_TYPE
Identifier: com.github.ashleymckinlay.x86_64.download.MongoDBCompass
Input:
  DOWNLOAD_TYPE: x64
  NAME: MongoDB Compass
MinimumVersion: '1.1'
Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: 'mongodb-compass-([A-Za-z0-9]+(\.[A-Za-z0-9]+)+)-darwin'
      result_output_var_name: DOWNLOAD_VERSION
      url: 'https://www.mongodb.com/try/download/compass'
  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%.dmg'
      url: 'https://downloads.mongodb.com/compass/mongodb-compass-%DOWNLOAD_VERSION%-darwin-%DOWNLOAD_TYPE%.dmg'
  - Processor: EndOfCheckPhase
  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/MongoDB Compass.app'
      requirement: 'identifier "com.mongodb.compass" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "4XWMY46275"'
