Description: Downloads the latest version of Keka.
Identifier: com.github.ashleymckinlay.download.Keka
Input:
  NAME: Keka
  GITHUB_REPO: aonez/Keka
MinimumVersion: '0.5.0'
Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: '%GITHUB_REPO%'
      asset_regex: '.*\.dmg'
  - Processor: URLDownloader
    Arguments:
      url: '%url%'
      filename: '%NAME%-%version%.dmg'
  - Processor: EndOfCheckPhase
  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/Keka.app'
      requirement: 'anchor apple generic and identifier "com.aone.keka" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "4FG648TM2A")'
