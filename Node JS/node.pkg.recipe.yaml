Description: Downloads the latest version of Node.js and creates an installer package.
Identifier: com.github.ashleymckinlay.pkg.node
ParentRecipe: com.github.ashleymckinlay.download.node
MinimumVersion: '2.9'

Input:
  NAME: Node.js
  SOFTWARE_TITLE: node

Process:
  - Processor: PkgCopier
    Arguments:
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'
      source_pkg: '%pathname%'

  - Processor: com.github.smithjw.processors/FriendlyPathDeleter
    Arguments:
      fail_deleter_silently: true
      path_list:
        - '%RECIPE_CACHE_DIR%/Universal'
        - '%RECIPE_CACHE_DIR%/extractedfile'
