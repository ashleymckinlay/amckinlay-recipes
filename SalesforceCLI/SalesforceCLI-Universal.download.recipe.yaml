Comment: |
  Stops processing if neither download has changed. To override this you can run the recipe with
  --key BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED=True
Description: Downloads the latest versions of SalesforceCLI (arm and intel).
Identifier: com.github.ashleymckinlay.download.SalesforceCLI-Universal
MinimumVersion: '2.4.1'

Input:
  NAME: SalesforceCLI
  arm_dl_url: 'https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-arm64.pkg'
  intel_dl_url: 'https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-x64.pkg'
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLDownloaderPython
    Arguments:
      filename: 'sf-arm64.pkg'
      download_dir: '%RECIPE_CACHE_DIR%/downloads'
      url: '%arm_dl_url%'

  - Processor: com.github.ashleymckinlay.SharedProcessors/DownloadChangedRecorder
    Arguments:
      result_output_var_name: download_1_changed

  - Processor: URLDownloaderPython
    Arguments:
      filename: 'sf-x64.pkg'
      download_dir: '%RECIPE_CACHE_DIR%/downloads'
      url: '%intel_dl_url%'

  - Processor: EndOfCheckPhase
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_1_changed == False AND download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%RECIPE_CACHE_DIR%/downloads/sf-arm64.pkg'
      expected_authority_names:
        - 'Developer ID Installer: salesforce.com (62J96EUJ9N)'
        - Developer ID Certification Authority
        - Apple Root CA

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%RECIPE_CACHE_DIR%/downloads/sf-x64.pkg'
      expected_authority_names:
        - 'Developer ID Installer: salesforce.com (62J96EUJ9N)'
        - Developer ID Certification Authority
        - Apple Root CA
