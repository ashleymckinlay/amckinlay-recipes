Comment: Created with Recipe Robot v2.3.2 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of OmniDiskSweeper.
Identifier: com.github.ashleymckinlay.download.OmniDiskSweeper
MinimumVersion: '2.3'

Input:
  NAME: OmniDiskSweeper

Process:
  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%.dmg'
      url: https://www.omnigroup.com/download/latest/OmniDiskSweeper

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/OmniDiskSweeper.app'
      requirement: 'identifier "com.omnigroup.OmniDiskSweeper" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "34YW5XSRB7"'

  - Processor: Versioner
    Arguments:
      input_plist_path: '%pathname%/OmniDiskSweeper.app/Contents/Info.plist'
      plist_version_key: CFBundleShortVersionString
