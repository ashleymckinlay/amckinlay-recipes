Comment: Created with Recipe Robot
Description: |
  Downloads the latest version of Wireshark and builds a pkg.
Identifier: com.github.ashleymckinlay.pkg.Wireshark
Input:
  NAME: Wireshark
MinimumVersion: '0.4.0'
ParentRecipe: com.github.ashleymckinlay.download.Wireshark
Process:
  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: '%pathname%'

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: '%RECIPE_CACHE_DIR%/scripts'
      pkgdirs: {}

  - Processor: PkgRootCreator
    Arguments:
      pkgdirs:
        Applications: '0775'
      pkgroot: '%RECIPE_CACHE_DIR%/universal_pkg'

  - Processor: Copier
    Arguments:
      destination_path: '%pkgroot%/Applications/Wireshark.app'
      source_path: '%pathname%/Wireshark.app'

  - Processor: FileCreator
    Arguments:
      file_path: '%RECIPE_CACHE_DIR%/scripts/postinstall'
      file_mode: '0755'
      file_content: |
        #!/bin/bash

        # Determine working directory
        installDir=$(dirname $0)

        /usr/sbin/installer -pkg /Applications/Wireshark.app/Contents/Resources/Extras/Install\ ChmodBPF.pkg -target "$3"
        /usr/sbin/installer -pkg /Applications/Wireshark.app/Contents/Resources/Extras/Add\ Wireshark\ to\ the\ system\ path.pkg -target "$3"

        exit 0

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        chown:
          - group: 'admin'
            path: 'Applications'
            user: 'root'
        id: 'org.wireshark.Wireshark.pkg'
        pkgdir: '%RECIPE_CACHE_DIR%'
        scripts: '%RECIPE_CACHE_DIR%/scripts'
      pkgname: '%NAME%-%version%'



  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/Universal'
        - '%RECIPE_CACHE_DIR%/scripts'
        - '%RECIPE_CACHE_DIR%/universal_pkg'
