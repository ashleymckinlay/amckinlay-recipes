why Description: |
  Builds separate arm64 and x86_64 component packages, then wraps them in a
  top-level installer whose postinstall script installs only the package that
  matches the device architecture.
Identifier: com.github.ashleymckinlay.pkg.pgAdmin4
ParentRecipe: com.github.ashleymckinlay.download.pgAdmin4
MinimumVersion: '2.9'

Input:
  NAME: pgAdmin4
  SOFTWARE_TITLE: pgAdmin 4
  # The app bundle name; kept separate because NAME/SOFTWARE_TITLE are often overridden
  APP_NAME: pgAdmin 4

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: '%RECIPE_CACHE_DIR%/payload'
      pkgdirs:
        pkgroot: '0775'
        scripts: '0775'

  - Processor: Copier
    Arguments:
      source_path: '%RECIPE_CACHE_DIR%/downloads/%NAME%-arm64.dmg'
      destination_path: '%RECIPE_CACHE_DIR%/payload/scripts/%NAME%-arm64.dmg'

  - Processor: Copier
    Arguments:
      source_path: '%RECIPE_CACHE_DIR%/downloads/%NAME%-x86_64.dmg'
      destination_path: '%RECIPE_CACHE_DIR%/payload/scripts/%NAME%-x86_64.dmg'

  - Processor: PlistReader
    Arguments:
      info_path: '%RECIPE_CACHE_DIR%/downloads/%NAME%-arm64.dmg/%APP_NAME%.app/Contents/Info.plist'
      plist_keys:
        CFBundleIdentifier: bundleid
        CFBundleName: app_name

  - Processor: FileCreator
    Arguments:
      file_path: '%RECIPE_CACHE_DIR%/payload/scripts/postinstall'
      file_mode: '0755'
      file_content: |
        #!/bin/bash
        if [[ $( /usr/bin/arch ) = arm64* ]]; then
          /usr/bin/hdiutil attach "%NAME%-arm64.dmg" -mountpoint "/Volumes/%SOFTWARE_TITLE%" -nobrowse
        else
          /usr/bin/hdiutil attach "%NAME%-x86_64.dmg" -mountpoint "/Volumes/%SOFTWARE_TITLE%" -nobrowse
        fi

        if [[ ! -d "/Volumes/%SOFTWARE_TITLE%/%APP_NAME%.app" ]]; then
          echo "/Volumes/%SOFTWARE_TITLE%/%APP_NAME%.app not found"
          /usr/bin/hdiutil detach "/Volumes/%SOFTWARE_TITLE%"
          exit 1
        fi

        # Remove any existing copy first; cp -R into an existing .app nests the new bundle inside it
        /bin/rm -rf "/Applications/%APP_NAME%.app"
        /usr/bin/ditto "/Volumes/%SOFTWARE_TITLE%/%APP_NAME%.app" "/Applications/%APP_NAME%.app"
        /usr/bin/hdiutil detach "/Volumes/%SOFTWARE_TITLE%"
        exit 0

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        id: '%bundleid%'
        options: purge_ds_store
        pkgdir: '%RECIPE_CACHE_DIR%'
        pkgname: '%SOFTWARE_TITLE%-%version%'
        pkgroot: '%RECIPE_CACHE_DIR%/payload/pkgroot'
        scripts: '%RECIPE_CACHE_DIR%/payload/scripts'
        version: '%version%'

  - Processor: com.github.smithjw.processors/FriendlyPathDeleter
    Arguments:
      fail_deleter_silently: true
      path_list:
        - '%RECIPE_CACHE_DIR%/payload'
