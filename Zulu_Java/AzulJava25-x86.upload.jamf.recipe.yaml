Description: |
  Downloads the latest version of AzulZuluJava, makes a pkg and uploads it to the Jamf Pro
  Server. Old packages matching PKG_NAME_MATCH are pruned to keep the most recent
  PKG_TO_KEEP versions.

  The pkg is renamed %NAME%<major>_<bundle type>_<arch>-<java version>... so PKG_NAME_MATCH
  only prunes this major version, bundle type and architecture.

  This recipe stops at "upload + cleanup" and creates no policy or smart group, so
  overrides can own their own policy and scope. Set REMOVE_OLD_PACKAGES to 'false'
  to skip the cleanup.
Identifier: com.github.ashleymckinlay.x86_64.jamf.upload.AzulZuluJava25
ParentRecipe: com.github.ashleymckinlay.x86_64.pkg.AzulZuluJava25
MinimumVersion: '2.3'

Input:
  NAME: 'AzulZuluJava'
  CATEGORY: 'Developer Tools'
  PACKAGE_INFO: autopkg
  PKG_NAME_MATCH: '%NAME%%JAVA_MAJOR_VERSION%_%BUNDLE_TYPE%_%ARCHITECTURE%-'
  PKG_TO_KEEP: '2'
  REMOVE_OLD_PACKAGES: 'true'

Process:
  - Processor: FileMover
    Arguments:
      source: '%pkg_path%'
      target: '%RECIPE_CACHE_DIR%/%NAME%%JAVA_MAJOR_VERSION%_%BUNDLE_TYPE%_%ARCHITECTURE%-%java_version%.%openjdk_build_number%-%version%.pkg'

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: '%CATEGORY%'

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_path: '%RECIPE_CACHE_DIR%/%NAME%%JAVA_MAJOR_VERSION%_%BUNDLE_TYPE%_%ARCHITECTURE%-%java_version%.%openjdk_build_number%-%version%.pkg'
      pkg_category: '%CATEGORY%'
      pkg_info: '%PACKAGE_INFO%'

  - Processor: StopProcessingIf
    Arguments:
      predicate: '%REMOVE_OLD_PACKAGES% == false'

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageCleaner
    Arguments:
      pkg_name_match: '%PKG_NAME_MATCH%'
      versions_to_keep: '%PKG_TO_KEEP%'
