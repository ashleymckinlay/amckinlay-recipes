Description: |
  Creates a pkg to deploy http://aws.amazon.com/cli/

  Tags are used since contents of pkg don't have easily parse-able version, probably brittle.
Identifier: com.github.ashleymckinlay.pkg.AWSCLI
MinimumVersion: '0.4.0'
ParentRecipe: com.github.ashleymckinlay.download.AWSCLI

Input:
  NAME: AWSCLI

Process:
  - Processor: URLTextSearcher
    Arguments:
      Comment: Regex allows for double-digits in any position but assumes 1.2.3 format
      re_pattern: \d*\.\d*\.\d*
      result_output_var_name: version
      url: https://api.github.com/repos/aws/aws-cli/tags

  - Processor: PkgCopier
    Arguments:
      pkg_path: '%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg'
      source_pkg: '%pathname%'

  - Processor: com.github.smithjw.processors/FriendlyPathDeleter
    Arguments:
      fail_deleter_silently: true
      path_list:
        - '%RECIPE_CACHE_DIR%/extractedfile'
