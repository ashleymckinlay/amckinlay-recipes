Description: Downloads the latest version of WalkMe.
Identifier: com.github.ashleymckinlay.download.walkme
MinimumVersion: '1.0.0'

Input:
  NAME: WalkMe
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%.dmg'
      url: https://cdn.walkme.com/walkme-editor/latest/mac/WalkMeInstaller.dmg

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/WalkMe.app'
      requirement: 'identifier "com.walkme.editor" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = F3929QQL5Q'
