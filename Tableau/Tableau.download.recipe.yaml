Description: Downloads latest Tableau Desktop disk image.
Identifier: com.github.ashleymckinlay.download.tableau
MinimumVersion: '0.3.1'

Input:
  DOWNLOAD_URL: https://www.tableau.com/downloads/desktop/mac
  NAME: TableauDesktop
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%.dmg'
      url: '%DOWNLOAD_URL%'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      expected_authority_names:
        - 'Developer ID Installer: Tableau Software, LLC (QJ4XPRK37C)'
        - Developer ID Certification Authority
        - Apple Root CA
      input_path: '%pathname%/Tableau Desktop.pkg'
