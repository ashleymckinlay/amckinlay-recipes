Description: |
  Downloads the latest Support App installer pkg (https://github.com/root3nl/supportapp) and verifies it is signed
  by Root3 B.V.'s Developer ID Installer (Team ID 98LJ4XBGYK). The pkg is universal (Intel and Apple silicon).
Identifier: com.github.ashleymckinlay.download.Support_App
MinimumVersion: '2.3'

Input:
  NAME: Support App
  SOFTWARE_TITLE: Support_App
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: root3nl/supportapp
      asset_regex: ^Support\.[0-9.]+\.pkg$

  - Processor: URLDownloader
    Arguments:
      filename: '%SOFTWARE_TITLE%.pkg'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%'
      expected_authority_names:
        - 'Developer ID Installer: Root3 B.V. (98LJ4XBGYK)'
        - Developer ID Certification Authority
        - Apple Root CA
