Comment: Created with Recipe Robot v1.1.2 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of KNIME Analytics Platform.
Identifier: com.github.ashleymckinlay.download.KNIME
MinimumVersion: '1.0.0'

Input:
  DOWNLOAD_URL: https://download.knime.org/analytics-platform/macosx/knime-latest-app.macosx.cocoa.x86_64.dmg
  NAME: KNIME_Analytics_Platform

Process:
  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%.dmg'
      url: '%DOWNLOAD_URL%'

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/KNIME*.app'
      requirement: 'identifier "org.knime.desktop.product" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = V7WZJX2HS9'

  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: '%RECIPE_CACHE_DIR%/downloads/KNIME_Analytics_Platform.dmg'
