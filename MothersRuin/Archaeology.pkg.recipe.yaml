Description: Downloads the latest version of Archaeology and creates a package that installs it to /Applications.
Identifier: com.github.ashleymckinlay.pkg.Archaeology
ParentRecipe: com.github.ashleymckinlay.download.Archaeology
MinimumVersion: '2.3'

Input:
  NAME: Archaeology
  SOFTWARE_TITLE: Archaeology

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: '%pathname%/Archaeology.app'
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'
