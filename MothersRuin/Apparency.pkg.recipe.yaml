Description: Downloads the latest version of Apparency and creates a package that installs it to /Applications.
Identifier: com.github.ashleymckinlay.pkg.Apparency
ParentRecipe: com.github.ashleymckinlay.download.Apparency
MinimumVersion: '2.3'

Input:
  NAME: Apparency
  SOFTWARE_TITLE: Apparency

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: '%pathname%/Apparency.app'
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'
